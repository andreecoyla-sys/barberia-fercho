{% extends "oscar/base.html" %}

{% block extrastyles %}
    {{ block.super }}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Fondo elegante con textura sutil tipo barbería y profundidad */
        body {
            background-color: #f3f1ec !important;
            background-image: 
                radial-gradient(circle at 12% 18%, rgba(197, 157, 95, 0.11) 0%, transparent 45%),
                radial-gradient(circle at 88% 82%, rgba(18, 18, 18, 0.07) 0%, transparent 45%),
                repeating-linear-gradient(
                    45deg,
                    rgba(197, 157, 95, 0.035) 0px,
                    rgba(197, 157, 95, 0.035) 2px,
                    transparent 2px,
                    transparent 14px
                ) !important;
            background-attachment: fixed !important;
            color: #121212 !important;
            font-family: 'Inter', -apple-system, sans-serif !important;
        }

        /* Contenedores transparentes para dejar lucir el fondo */
        .page, .page_inner, .container-fluid {
            background: transparent !important;
        }

        /* Barra superior negro carbón con borde dorado */
        header.header, .navbar-accounts {
            background: #121212 !important;
            border-bottom: 2px solid #c59d5f !important;
        }
        header.header a, .navbar-accounts a {
            color: #e5e5e5 !important;
        }

        /* Panel lateral de categorías y migas de pan estilizados */
        .side_categories, .breadcrumb {
            background: #ffffff !important;
            border: 1px solid #e5dfd3 !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 14px rgba(18, 18, 18, 0.04) !important;
        }

        /* Grilla exacta: 2 columnas en celular, 3 en computadora, cero huecos */
        .fercho-grid-productos {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 14px !important;
            width: 100% !important;
            margin-bottom: 24px !important;
        }
        @media (min-width: 768px) {
            .fercho-grid-productos {
                grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
                gap: 22px !important;
            }
        }
        .fercho-grid-item {
            width: 100% !important;
            min-width: 0 !important;
        }

        /* Tarjeta minimalista con mayor relieve sobre el nuevo fondo */
        .fercho-grid-item article.product_pod {
            background: #ffffff !important;
            border: 1px solid #e5dfd3 !important;
            border-radius: 14px !important;
            padding: 10px !important;
            margin: 0 !important;
            box-shadow: 0 6px 18px rgba(18, 18, 18, 0.06) !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: space-between !important;
            height: 100% !important;
            text-align: left !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease !important;
        }
        .fercho-grid-item article.product_pod:hover {
            transform: translateY(-4px) !important;
            border-color: #c59d5f !important;
            box-shadow: 0 10px 24px rgba(197, 157, 95, 0.2) !important;
        }

        /* Foto grande protagonista con línea dorada inferior */
        .fercho-grid-item article.product_pod .image_container {
            width: 100% !important;
            height: 160px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: #f8f7f4 !important;
            border-radius: 10px !important;
            border: none !important;
            border-bottom: 2px solid #c59d5f !important;
            padding: 8px !important;
            margin-bottom: 10px !important;
            overflow: hidden !important;
        }
        @media (min-width: 768px) {
            .fercho-grid-item article.product_pod .image_container {
                height: 210px !important;
            }
        }
        .fercho-grid-item article.product_pod .image_container img {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* Título compacto y alineado */
        .fercho-grid-item article.product_pod h3 {
            font-size: 0.86rem !important;
            line-height: 1.3 !important;
            margin: 0 0 4px 0 !important;
            min-height: 2.6em !important;
            display: -webkit-box !important;
            -webkit-line-clamp: 2 !important;
            -webkit-box-orient: vertical !important;
            overflow: hidden !important;
        }
        .fercho-grid-item article.product_pod h3 a {
            color: #121212 !important;
            font-size: 0.86rem !important;
            font-weight: 700 !important;
            text-decoration: none !important;
        }

        /* Precio y disponibilidad */
        .fercho-grid-item article.product_pod .product_price {
            margin-top: auto !important;
        }
        .fercho-grid-item article.product_pod .price_color {
            color: #121212 !important;
            font-size: 0.98rem !important;
            font-weight: 700 !important;
            margin-bottom: 2px !important;
        }
        .fercho-grid-item article.product_pod .instock {
            font-size: 0.72rem !important;
            color: #28a745 !important;
            font-weight: 600 !important;
            margin-bottom: 8px !important;
        }

        /* Botón limpio de ancho completo con efecto hover dorado */
        .fercho-grid-item article.product_pod .btn-primary {
            background: #121212 !important;
            border: 1px solid #121212 !important;
            color: #c59d5f !important;
            font-size: 0.78rem !important;
            font-weight: 600 !important;
            border-radius: 8px !important;
            padding: 8px 6px !important;
            width: 100% !important;
            transition: all 0.2s ease !important;
        }
        .fercho-grid-item article.product_pod .btn-primary:hover {
            background: #c59d5f !important;
            border-color: #c59d5f !important;
            color: #121212 !important;
        }
    </style>
{% endblock %}
